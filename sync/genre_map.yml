# Tags that mean different things in different scenes. The artist's other tags decide: the genre whose
# context tags weigh most wins; with no context, the tag is ignored.
_ambiguous:
  hardcore:
    Hardcore: [gabber, gabba, happy hardcore, hardcore techno, early hardcore, frenchcore, uptempo, terrorcore,
               speedcore, rave, techno, electronic, hardstyle, dance, thunderdome, rotterdam]
    Punk: [punk, hardcore punk, punk rock, metalcore, post-hardcore, metal, crust, straight edge, beatdown, nyhc, emo]

# Fallback for tags (and Spotify genre names) not listed above: the first pattern that matches wins.
# Patterns are case-insensitive regular expressions. Order matters: Nederhop before Hip-hop.
_keywords:
