name: Backfill

# Every six hours, fill in what earlier runs couldn't (mostly Spotify IDs after a rate limit) and check a
# few artists for new releases. Once nothing is missing this takes under a minute and writes nothing.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (report only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crate-sync
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Your play history and Notion IDs get committed to this repository, so it must be private. In a
      # copy that isn't set up (no NOTION_TOKEN), scheduled runs simply stop here.
      - name: Check this repository is set up and private
        id: ready
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::Crate isn't set up in this repository (no NOTION_TOKEN secret), so there's nothing to do. See docs/SETUP.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::This repository is public. Crate saves your listening history in it, so make it private first: Settings → General → Danger Zone → Change visibility."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.ready.outputs.go == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt
        if: steps.ready.outputs.go == 'true'

      - name: Backfill
        if: steps.ready.outputs.go == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python sync/backfill.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save
        if: steps.ready.outputs.go == 'true' && !inputs.dry_run
        run: |
          git config user.name "crate bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state sync/config.yml
          git diff --cached --quiet || git commit -m "Backfill: save state"
          git pull --rebase --quiet && git push
