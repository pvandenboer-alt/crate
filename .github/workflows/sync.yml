name: Weekly sync

# Once a week: new Last.fm scrobbles, new artists and albums, genres, levels and new releases.
# The time is in UTC: Monday 06:00 UTC. Change the cron line to suit your time zone.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (report only, nothing written)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Your play history and Notion IDs get committed to this repository, so it must be private. In a
      # copy that isn't set up (no NOTION_TOKEN), scheduled runs simply stop here.
      - name: Check this repository is set up and private
        id: ready
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::Crate isn't set up in this repository (no NOTION_TOKEN secret), so there's nothing to do. See docs/SETUP.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::This repository is public. Crate saves your listening history in it, so make it private first: Settings → General → Danger Zone → Change visibility."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.ready.outputs.go == 'true'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt
        if: steps.ready.outputs.go == 'true'

      - name: Sync
        if: steps.ready.outputs.go == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python sync/weekly.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save
        if: steps.ready.outputs.go == 'true' && !inputs.dry_run
        run: |
          git config user.name "crate bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state sync/config.yml
          git diff --cached --quiet || git commit -m "Weekly sync: save play counts"
          git pull --rebase --quiet && git push
