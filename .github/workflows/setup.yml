name: Set up Notion

# Run once, after adding the NOTION_TOKEN secret: creates the Crate databases in Notion (or finds the ones
# you already have) and saves their IDs in sync/config.yml. Safe to run again.
on:
  workflow_dispatch:
    inputs:
      page:
        description: Link of the Notion page to create everything in (only needed if your integration sees several pages)
        type: string
        default: ""
      dry_run:
        description: Dry run (only report what it would do)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crate-sync
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Your play history and Notion IDs get committed to this repository, so it must be private. In a
      # copy that isn't set up (no NOTION_TOKEN), scheduled runs simply stop here.
      - name: Check this repository is set up and private
        id: ready
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Add the NOTION_TOKEN repository secret first (see docs/SETUP.md)."
            exit 1
          fi
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::This repository is public. Crate saves your listening history in it, so make it private first: Settings → General → Danger Zone → Change visibility."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Set up Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE: ${{ inputs.page }}
        run: python sync/setup.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "crate bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state sync/config.yml
          git diff --cached --quiet || git commit -m "Set up Notion: save database IDs"
          git pull --rebase --quiet && git push
