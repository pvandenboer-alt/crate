name: Import Spotify history

# Manual only. Start with a dry run (the default): it writes a report to the run summary and
# changes nothing. When the numbers look right, run it again with "Dry run" unticked.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (report only, nothing written to Notion)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: crate-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Your play history and Notion IDs get committed to this repository, so it must be private. In a
      # copy that isn't set up (no NOTION_TOKEN), scheduled runs simply stop here.
      - name: Check this repository is set up and private
        id: ready
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Add the NOTION_TOKEN repository secret first (see docs/SETUP.md)."
            exit 1
          fi
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::This repository is public. Crate saves your listening history in it, so make it private first: Settings → General → Danger Zone → Change visibility."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Check secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          missing=""
          for s in LASTFM_API_KEY SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q sync/tests

      - name: Import
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python sync/importer.py ${{ inputs.dry_run && ' ' || '--write' }}

      - name: Save
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "crate bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state sync/config.yml
          git diff --cached --quiet || git commit -m "Import: save play counts"
          git pull --rebase --quiet && git push
