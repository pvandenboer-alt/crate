name: Tests

# The sync's tests run against fakes (no secrets, no network), on every push and pull request.
on:
  push:
    paths: ['sync/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['sync/**', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - run: python -m pytest -q sync/tests
